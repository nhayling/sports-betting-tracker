<!DOCTYPE html>
<html lang="en" xmlns="http://www.w3.org/1999/xhtml" xmlns:v="urn:schemas-microsoft-com:vml" xmlns:o="urn:schemas-microsoft-com:office:office">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="x-apple-disable-message-reformatting">
  <meta name="format-detection" content="telephone=no, date=no, address=no, email=no">
  <!-- Light only, like the app's light theme: asks mail apps not to invert it. -->
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
  <title>Slip Club</title>
  <!--[if mso]>
  <noscript><xml><o:OfficeDocumentSettings><o:PixelsPerInch>96</o:PixelsPerInch></o:OfficeDocumentSettings></xml></noscript>
  <style>td, th, h1, p, a, span { font-family: Arial, sans-serif !important; }</style>
  <![endif]-->
  <style>
    /* The app's own fonts, served from slipclub.app. Apple Mail and iOS use them; the rest fall back. */
    @font-face { font-family: 'Barlow'; font-weight: 400; src: url('https://slipclub.app/fonts/Barlow-400.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow'; font-weight: 600; src: url('https://slipclub.app/fonts/Barlow-600.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 700; src: url('https://slipclub.app/fonts/BarlowCondensed-700.woff2') format('woff2'); }
    @font-face { font-family: 'Barlow Condensed'; font-weight: 800; src: url('https://slipclub.app/fonts/BarlowCondensed-800.woff2') format('woff2'); }
    :root { color-scheme: light; supported-color-schemes: light; }
    body { margin: 0 !important; padding: 0 !important; width: 100% !important; -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
    table { border-collapse: collapse; mso-table-lspace: 0; mso-table-rspace: 0; }
    img { border: 0; outline: none; text-decoration: none; -ms-interpolation-mode: bicubic; }
    a[x-apple-data-detectors] { color: inherit !important; text-decoration: none !important; }
    ::selection { background: #ffd200; color: #0b1f3a; }
    @media (max-width: 620px) {
      .px { padding-left: 20px !important; padding-right: 20px !important; }
      .h1 { font-size: 26px !important; }
    }
  </style>
</head>
<body style="margin:0; padding:0; background-color:#e6ebf2; color:#0b1f3a;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#e6ebf2" style="background-color:#e6ebf2;">
    <tr>
      <td align="center" style="padding:24px 8px 32px;">
        <!--[if mso]><table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" align="center"><tr><td><![endif]-->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:600px; width:100%;">
          <!-- The navy shell: the app's header band, wordmark and all. The logo's alt is empty so inbox previews start with each email's own line. -->
          <tr>
            <td class="px" bgcolor="#0b1f3a" style="background-color:#0b1f3a; padding:20px 32px;">
              <a href="https://slipclub.app/" title="Slip Club" aria-label="Slip Club" style="text-decoration:none;"><img src="https://slipclub.app/email/wordmark.png" width="113" height="28" alt="" style="display:block; width:113px; height:28px; color:#ffffff; font-family:'Barlow Condensed','Arial Narrow',Arial,sans-serif; font-size:22px; font-weight:800; letter-spacing:0.02em;"></a>
            </td>
          </tr>
          <!-- The plate: white, square, navy text. -->
          <tr>
            <td class="px" bgcolor="#ffffff" style="background-color:#ffffff; padding:28px 32px 32px; font-family:'Barlow',-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:16px; line-height:1.5; color:#0b1f3a;">
              {{{ @content }}}
            </td>
          </tr>
          <tr>
            <td class="px" style="padding:20px 32px 0; font-family:'Barlow',-apple-system,'Segoe UI',Roboto,Arial,sans-serif; font-size:12px; line-height:1.5; color:#4a5b75;">
              <p style="margin:0 0 4px;"><a href="https://slipclub.app/" style="color:#0b1f3a; font-weight:600; text-decoration:underline; text-underline-offset:2px;">Slip Club</a> is an independent tracker, not a sportsbook. 18+.</p>
            </td>
          </tr>
        </table>
        <!--[if mso]></td></tr></table><![endif]-->
      </td>
    </tr>
  </table>
</body>
</html>
